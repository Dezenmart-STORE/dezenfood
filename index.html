    <!-- Splash screen styles - loaded synchronously to prevent any white flash -->
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #212428;
      }

      /* ── Splash shell ──────────────────────────────────────────────────────── */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #212428;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        /* Fade-out transition triggered by JS adding .hidden */
        transition: opacity 0.45s ease-out;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* ── Content column ────────────────────────────────────────────────────── */
      .sp-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        width: 100%;
        max-width: 440px;
        /* Safe margin so nothing clips near device edges */
        box-sizing: border-box;
      }

      /* ── Logo ──────────────────────────────────────────────────────────────── */
      /*
        min(72vmin, 280px):
          vmin = smaller of vw / vh - keeps logo proportional on any orientation.
          72vmin on a 375×812 phone ≈ 270px (just under the cap).
          Cap at 280px so it doesn't overpower larger screens.
          Height follows the wordmark's ~2:1 aspect ratio.
      */
      .sp-logo {
        width: min(72vmin, 280px);
        height: auto;
        display: block;
        flex-shrink: 0;
        opacity: 0;
        transform: scale(0.72);
        animation: spLogoIn 0.55s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
      }

      @keyframes spLogoIn {
        to { opacity: 1; transform: scale(1); }
      }

      /* Someone who asked for less motion gets the finished logo, immediately. */
      @media (prefers-reduced-motion: reduce) {
        .sp-logo { animation: none; opacity: 1; transform: none; }
        .sp-tagline, .sp-dots { animation: none; opacity: 1; transform: none; }
        .sp-dots span { animation: none; }
      }

      /* ── Tagline ───────────────────────────────────────────────────────────── */
      .sp-tagline {
        margin: 1.25rem 0 0;
        color: rgba(255, 255, 255, 0.4);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: clamp(0.65rem, 2.2vw, 0.8rem);
        font-weight: 400;
        letter-spacing: 0.1em;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        animation: spSlideUp 0.5s ease-out 0.55s forwards;
      }

      @keyframes spSlideUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── Loading dots ──────────────────────────────────────────────────────── */
      .sp-dots {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 2.75rem;
        opacity: 0;
        animation: spSlideUp 0.4s ease-out 1s forwards;
      }

      .sp-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: spDot 1.3s ease-in-out infinite;
      }

      .sp-dots span:nth-child(1) {
        background: __BRAND_PRIMARY__;
        animation-delay: 0s;
      }

      .sp-dots span:nth-child(2) {
        background: rgba(255, 255, 255, 0.55);
        animation-delay: 0.2s;
      }

      .sp-dots span:nth-child(3) {
        background: __BRAND_PRIMARY__;
        animation-delay: 0.4s;
      }

      @keyframes spDot {
        0%, 75%, 100% { transform: scale(0.85); opacity: 0.4; }
        38%           { transform: scale(1.35); opacity: 1; }
      }
    </style>

  <body>
    <!-- Splash screen - visible before React hydrates. Dismissed via app-ready event. -->
    <div id="splash-screen" role="status" aria-label="Loading __BRAND_NAME__">
      <div class="sp-inner">

        <img
          class="sp-logo"
          src="/images/logo.png"
          width="1636"
          height="816"
          alt=""
          fetchpriority="high"
        />
        <p class="sp-tagline">__BRAND_TAGLINE__</p>

        <div class="sp-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>

      </div>
    </div>

    <div id="root" class="relative"></div>

    <!--
      Splash dismiss logic.
      The splash stays until React fires window.dispatchEvent(new Event('app-ready')).

      MIN_MS is 1 000 ms everywhere: long enough for the logo and tagline to
      finish animating in, so the splash never disappears mid-entrance. It used to be 2 000 ms in standalone and
      1 000 ms in a browser tab - a floor the app was held behind even when React
      was ready in 200 ms. The PWA now launches a full second sooner, and nothing
      else waits on a fixed timer.

      This is the ONLY full-screen loading state in the app. The React Loadscreen
      that used to re-appear on route changes and while auth resolved is gone; a
      lazy route now keeps the current page on screen instead of blacking it out.

      Hard cap of 8 000 ms as a safety net if React never fires the event.
    -->
    <script>
      (function () {
        var splash = document.getElementById("splash-screen");
        if (!splash) return;

        var MIN_MS = 1000;
        var MAX_MS = 8000;
        var startTime = Date.now();
        var dismissed = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          var wait = Math.max(0, MIN_MS - (Date.now() - startTime));
          setTimeout(function () {
            splash.classList.add("hidden");
            setTimeout(function () {
              splash.remove();
              document.body.style.overflow = "";
            }, 450);
          }, wait);
        }

        /* React signals the app is mounted and ready to display */
        window.addEventListener("app-ready", dismiss, { once: true });

        /* Hard timeout - dismiss even if React never fires */
        setTimeout(dismiss, MAX_MS);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
